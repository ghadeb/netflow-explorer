name: ClickHouse pilot smoke test
on:
  push:
    branches: [ghadeb/clickhouse-pilot]
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pilot
        run: |
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout --detach "$GITHUB_SHA"
      - name: Verify cold SQLite backup and WAL recovery
        run: |
          export TEST_SQLITE_VOLUME="$RUNNER_TEMP/sqlite-fixture"
          mkdir -p "$TEST_SQLITE_VOLUME" "$RUNNER_TEMP/backup-bin"
          backup=$(mktemp -d /dev/shm/netflow-backup.XXXXXXXX)
          mkdir "$backup/restore"
          python3 - <<'PY'
          import os
          import sqlite3
          db = sqlite3.connect(os.environ["TEST_SQLITE_VOLUME"] + "/flows.sqlite3")
          db.execute("PRAGMA journal_mode=WAL")
          db.execute("CREATE TABLE records(bytes)")
          db.execute("INSERT INTO records VALUES (12345)")
          db.commit()
          os._exit(0)
          PY
          test -s "$TEST_SQLITE_VOLUME/flows.sqlite3-wal"
          cat > "$RUNNER_TEMP/backup-bin/docker" <<'SH'
          #!/usr/bin/env bash
          case "$1 $2" in
            "volume inspect") printf '%s\n' "$TEST_SQLITE_VOLUME" ;;
            "ps --filter") exit 0 ;;
            *) exit 1 ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/backup-bin/docker"
          PATH="$RUNNER_TEMP/backup-bin:$PATH" ./scripts/backup-sqlite-volume.sh "$backup"
          (cd "$backup" && sha256sum -c ./*.sha256)
          tar -xJf "$backup"/*.tar.xz -C "$backup/restore"
          python3 - "$backup/restore/flows.sqlite3" <<'PY'
          import sqlite3
          import sys
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute("PRAGMA quick_check").fetchone() == ("ok",)
              assert db.execute("SELECT bytes FROM records").fetchone() == (12345,)
          PY
      - name: Prepare test credentials and TLS
        run: |
          umask 077
          printf 'FLOW_EXPORTERS=127.0.0.1\nCLICKHOUSE_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          ./scripts/tls.sh 127.0.0.1
      - name: Build and start the AMD64 pilot
        run: docker compose -f compose.clickhouse.yaml up -d --build --wait --wait-timeout 150
      - name: Test UDP, live queries and archives
        run: |
          docker compose -f compose.clickhouse.yaml cp tests/smoke_udp.py collector:/tmp/smoke_udp.py
          docker compose -f compose.clickhouse.yaml exec -T collector python - < tests/smoke_clickhouse.py
      - name: Report logs on failure
        if: failure()
        run: docker compose -f compose.clickhouse.yaml logs --tail=100
