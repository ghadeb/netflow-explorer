name: ClickHouse pilot smoke test
on:
  push:
    branches: [ghadeb/clickhouse-pilot]
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pilot
        run: |
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout --detach "$GITHUB_SHA"
      - name: Prepare test credentials and TLS
        run: |
          umask 077
          printf 'FLOW_EXPORTERS=127.0.0.1\nCLICKHOUSE_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          ./scripts/tls.sh 127.0.0.1
      - name: Build and start the AMD64 pilot
        run: docker compose -f compose.clickhouse.yaml up -d --build --wait --wait-timeout 150
      - name: Test UDP, live queries and archives
        run: |
          docker compose -f compose.clickhouse.yaml cp tests/smoke_udp.py collector:/tmp/smoke_udp.py
          docker compose -f compose.clickhouse.yaml exec -T collector python - < tests/smoke_clickhouse.py
      - name: Report logs on failure
        if: failure()
        run: docker compose -f compose.clickhouse.yaml logs --tail=100
