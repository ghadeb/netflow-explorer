name: fluxo-clickhouse

services:
  collector:
    image: fluxo-collector:clickhouse-pilot
    build: .
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      FLOW_EXPORTERS: ${FLOW_EXPORTERS:?Set the exporter source IPv4 addresses}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      PTR_DNS: ${PTR_DNS:-}
      TLS_VERIFY_HOST: ${TLS_VERIFY_HOST:-}
      NETFLOW_WEB_BIND: ${NETFLOW_WEB_BIND:-127.0.0.1}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: netflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_ARCHIVE_XZ_LEVEL: ${CLICKHOUSE_ARCHIVE_XZ_LEVEL:-3}
    ports:
      - "${NETFLOW_UDP_BIND:-127.0.0.1}:2055:2055/udp"
      - "${NETFLOW_UDP_BIND:-127.0.0.1}:2056:2056/udp"
      - "${NETFLOW_WEB_BIND:-127.0.0.1}:8001:8000/tcp"
    volumes:
      - archive-data:/archives
      - type: bind
        source: ./tls-fluxo
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/painel/healthcheck.py"]
      interval: 20s
      timeout: 4s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-public.ecr.aws/docker/library/clickhouse:26.8.36.3@sha256:55291d9993daee5b2a95d2555e8b31559741cef857672a54c122ee6ce836b0b1}
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 2g
    cpus: "${CLICKHOUSE_CPUS:-1.5}"
    environment:
      CLICKHOUSE_DB: netflow
      CLICKHOUSE_USER: netflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/pilot.xml:/etc/clickhouse-server/config.d/netflow-pilot.xml:ro
      - ./clickhouse/pilot-users.xml:/etc/clickhouse-server/users.d/netflow-pilot.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database netflow --query 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clickhouse-data:
  archive-data:
